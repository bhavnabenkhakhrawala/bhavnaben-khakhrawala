-size:12px;color:#666;margin:2px 0}.fl>div{flex:1;min-width:130px}.fl input,.fl select{width:100%}button,select,input{font:inherit;padding:8px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}button{cursor:pointer;background:#f26a1b;color:#fff;border:0}button.g{background:#eee;color:#333}button.r{background:#c0392b}header button{background:#ffffff22;text-transform:capitalize}header button.on{background:#ffc21a;color:#3b2113}main{padding:16px 4%;max-width:1100px;margin:auto}.c{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{display:inline-flex;gap:6px;border:1px solid #ccc;border-radius:99px;padding:3px 10px;margin:3px;cursor:pointer}.chip.x{background:#fde2de;text-decoration:line-through}.chip u{text-decoration:none;color:#c0392b}.bar{height:12px;background:#f26a1b;border-radius:6px}.new{background:#ffc21a;padding:1px 8px;border-radius:9px}#lg{max-width:340px;margin:12vh auto;padding:20px}#lg input{width:100%;margin:6px 0}h4{margin:10px 0 2px}</style></head><body>

<script>
let U,T='orders',O=[];const $=s=>document.querySelector(s),V={},e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(act,o={})=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act,...o})}).then(r=>{if(r.status==401){U=null;show();throw 0}if(!r.ok){alert(r.status==403?'Admin only':'Something went wrong');throw 0}return r.json()});
const rs=f=>new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)});
async function login(ev){ev.preventDefault();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act:'login',email:$('#em').value,password:$('#pw').value})});if(!r.ok)return alert('Wrong email or password');U=await r.json();show()}

const wn=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))return d;if(d.length==11&&d[0]=='0')d=d.slice(1);return d.length>=10?'91'+d.slice(-10):''};
const wt=t=>String(t==null?'':t).replace(/[*_~`]/g,'').replace(/\s*\n\s*/g,', ').trim(),R=n=>'₹'+(+n).toLocaleString('en-IN'),kc=n=>n<10?n+'\uFE0F\u20E3':n+'.';
function waMsg(x){const d=new Date(String(x.created_at).replace(' ','T')+'Z'),it=x.items||[],tot=it.reduce((a,i)=>a+(i.price||0)*i.qty,0),L=['🙏 *Namaste '+wt(x.name)+'!*','Thank you for ordering from *Bhavnaben Khakhrawala* 🌾','━━━━━━━━━━━━━━','🧾 *Order No:* '+x.order_no,'📅 *Date:* '+d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}),'📌 *Status:* '+x.status,'','📦 *YOUR ORDER*'];
it.forEach((i,n)=>L.push(kc(n+1)+' *'+wt(i.product_name)+'* – '+wt(i.flavour),'      '+wt(i.size_label)+(i.vac?' ('+wt(i.vl||'Vacuum pack')+')':'')+' × '+i.qty+(i.price!=null?' @ '+R(i.price)+' = *'+R(i.price*i.qty)+'*':'')));
L.push('━━━━━━━━━━━━━━');if(x.discount>0||(x.charges||[]).length)L.push('🧮 *Subtotal:* '+R(x.subtotal));if(x.discount>0)L.push('🎟️ *Coupon'+(x.coupon?' ('+wt(x.coupon)+')':'')+':* - '+R(x.discount));(x.charges||[]).forEach(c=>L.push('🚚 *'+wt(c.label)+':* '+R(c.amount)));if(x.total)L.push('💰 *TOTAL: '+R(x.total)+'*');if(x.address)L.push('📍 *Delivery to:* '+wt(x.address)+(x.city?', '+wt(x.city):'')+(x.pincode?' - '+wt(x.pincode):''));L.push('','🧾 *View / download your bill:*',location.origin+'/bill.html?no='+x.order_no+'&t='+x.tok,'','_Thank you for choosing us!_ 🙏','*Bhavnaben Khakhrawala* · Since 1998');return L.join('\n')}
const wa=x=>{const d=wn(x.phone);return d?`<a target="_blank" href="https://wa.me/${d}?text=${encodeURIComponent(waMsg(x))}"><button style="background:#25d366">WhatsApp</button></a>`:''};
const inv=(x,pr)=>`/bill.html?no=${x.order_no}&t=${x.tok}${pr?'&print=1':''}`;
const flt=()=>{const v=($('#oq')||{value:''}).value.toLowerCase(),s=($('#os')||{value:''}).value;document.querySelectorAll('.oc').forEach(c=>c.style.display=(!v||c.textContent.toLowerCase().includes(v))&&(!s||c.dataset.s==s)?'':'none')};
const NX={new:'packed',packed:'shipped',shipped:'delivered'},nx=x=>NX[x.status]?`<button onclick="go('status',{id:${x.id},v:'${NX[x.status]}'})">→ ${NX[x.status]}</button>`:'';
const fdt=d=>new Date(String(d).replace(' ','T')+'Z').toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}),mname=k=>new Date(k+'-15').toLocaleString('en-IN',{month:'long',year:'numeric'}),shm=(k,d)=>{const x=new Date(k+'-15');x.setMonth(x.getMonth()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
let MON=new Date(Date.now()+19800000).toISOString().slice(0,7),LP=null;
function dl(n,rows){const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}));a.download=n;a.click()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),250)}catch(e){}}
function clr(t){if(prompt('This permanently deletes ALL '+t+'. Type DELETE to confirm')=='DELETE')go('clear',{t,confirm:'DELETE'})}
V.orders=async()=>{O=await P('orders',{q:OF.q,s:OF.s});const A=U.role=='admin';$('#v').innerHTML=`<div class="row"><button onclick="mf()">+ Manual order</button>${A?`<a href="/api/export"><button class="g">Download CSV</button></a><button class="r" onclick="clr('orders')">Delete ALL orders</button>`:''}<input placeholder="Search name / phone / order no / city" id="oq" value="${e(OF.q)}" oninput="fSearch('oq','os',OF)" style="flex:1;min-width:200px"><select id="os" onchange="fSearch('oq','os',OF)"><option value="">All status</option>${['new','packed','shipped','delivered','cancelled'].map(s=>`<option ${OF.s==s?'selected':''}>${s}</option>`).join('')}</select></div><div class="kp" id="dash"></div><div id="mform" class="c" hidden></div>${A?selBar('orders'):''}<p><small>${O.length} orders shown${O.length>=300?' (latest 300, use search to find older ones)':''}</small></p>`+(O.map((x,n)=>`<div class="c oc" data-s="${x.status}"><div class="row">${A?`<input type="checkbox" class="sel" value="${x.id}">`:''}<b>${e(x.order_no)}</b>${x.status=='new'?'<span class="new">NEW</span>':''}${x.source=='manual'?'<span class="new" style="background:#cde">MANUAL</span>':''}<small>${e(x.created_at)} UTC</small><select onchange="go('status',{id:${x.id},v:this.value})">${['new','packed','shipped','delivered','cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${nx(x)}${x.source=='manual'?'':`<button class="g" onclick="lab(${n})">Print label</button>`}<a target="_blank" href="${inv(x)}"><button class="g">🧾 Invoice</button></a><a target="_blank" href="${inv(x,1)}"><button class="g">🖨️ Print</button></a>${wa(x)}${A?`<button class="r" onclick="if(confirm('Delete this order?'))go('delO',{id:${x.id}})">Delete</button>`:''}</div><p><b>${e(x.name)}</b> ${e(x.phone)}<br>${e(x.address)} ${e(x.city)} ${e(x.pincode)}${x.notes?'<br><i>'+e(x.notes)+'</i>':''}</p><p>${x.items.map(i=>`• ${e(i.product_name)} · ${e(i.flavour)} · ${e(i.size_label)}${i.vac?' ('+e(i.vl||'Vacuum pack')+')':''} × ${i.qty}${i.price!=null?' @ ₹'+i.price+' = ₹'+(i.price*i.qty):''}`).join('<br>')}</p><div class="tot"><span>Subtotal: <b>${R(x.subtotal)}</b></span>${x.discount>0?`<span class="dsc">Discount: − ${R(x.discount)} ${x.coupon?`<span class="cpn">${e(x.coupon)}</span>`:''}</span>`:''}${(x.charges||[]).map(c=>`<span>${e(c.label)}: ${R(c.amount)}</span>`).join('')}<span style="margin-left:auto;font-size:16px">Total: <b>${R(x.total)}</b></span></div></div>`).join('')||'<p>No orders yet.</p>');P('dash').then(d=>{LP=d.pending;$('#dash').innerHTML=`<div><b>${d.today.n}</b><span>Orders today · ${R(d.today.amt)}</span></div><div class="hl"><b>${d.pending}</b><span>New orders to pack</span></div><div><b>${R(d.month.amt)}</b><span>This month · ${d.month.n} orders</span></div>`}).catch(()=>{})};
async function mf(){const p=await P('prods'),u=a=>[...new Set(a)].map(x=>`<option value="${e(x)}">`).join('');const m=$('#mform');m.hidden=false;m.innerHTML=`<datalist id="dp">${u(p.map(x=>x.name))}</datalist><datalist id="df">${u(p.flatMap(x=>x.fl.map(f=>f.name)))}</datalist><datalist id="dz">${u(p.flatMap(x=>x.sizes.map(z=>z.label)))}</datalist><h3>Manual / walk-in order</h3><p><small>Type or pick product, flavour and size. It is counted in all totals.</small></p><div class="row"><input id="mn" placeholder="Customer name"><input id="mp" placeholder="Phone (optional)"><input id="md" type="date"><select id="ms"><option>delivered</option><option>new</option><option>packed</option><option>shipped</option></select><input id="mt" placeholder="Note (optional)"><input id="mc" placeholder="Coupon code (optional)" style="text-transform:uppercase"><input id="mch" type="number" min="0" placeholder="Delivery / other charge ₹ (optional)"></div><div id="mlines"></div><div class="row"><button class="g" onclick="addLine()">+ Add item</button><button onclick="msave()">Save order</button></div>`;addLine()}
function addLine(){$('#mlines').insertAdjacentHTML('beforeend','<div class="row il" style="margin:6px 0"><input list="dp" placeholder="Product" class="a"><input list="df" placeholder="Flavour" class="b"><input list="dz" placeholder="Size" class="c" style="width:90px"><input type="number" min="1" value="1" class="d" style="width:70px"></div>')}
async function msave(){const it=[...document.querySelectorAll('.il')].map(r=>({product:r.querySelector('.a').value.trim(),flavour:r.querySelector('.b').value.trim(),size:r.querySelector('.c').value.trim(),qty:+r.querySelector('.d').value||1})).filter(x=>x.product&&x.flavour);if(!it.length)return alert('Add at least one item with product and flavour');await go('manual',{name:$('#mn').value,phone:$('#mp').value,date:$('#md').value,status:$('#ms').value,notes:$('#mt').value,coupon:$('#mc').value,charge:$('#mch').value,items:it})}
function lab(n){const x=O[n],w=open('','_blank'),lg=location.origin+((window.SA&&SA.logo)||'/images/logo.png');w.document.write(`<body style="font:15px sans-serif;width:400px;border:2px solid #000;padding:14px"><div style="text-align:center"><img src="${lg}" style="height:84px"></div><div style="text-align:center;font-size:11.5px;line-height:1.4"><b>Office:</b> ${e((window.SA||{}).addr_office||'Plot no. B1, B2, Kailash Row House, opp. Mahavir Heights, New Kosad Road, Amroli, Surat')}<br><b>Shop:</b> ${e((window.SA||{}).addr_shop||'53, 54 Rang Nagar Society, Jain Temple Main Road, near Laxmi Flour Mill, Amroli, Surat')}<br>${e(((window.SA||{}).phone1)||'+91 99255 20051')} · ${e(((window.SA||{}).phone2)||'+91 99988 02435')} · WhatsApp +${e(String((window.SA||{}).wa_number||'916355934337').replace(/\D/g,'').replace(/^(\d{10})$/,'91$1'))}</div><hr><b>TO:</b><br><big>${e(x.name)}</big><br>${e(x.address)}<br>${e(x.city)} - ${e(x.pincode)}<br>Phone: ${e(x.phone)}<hr>Order: ${e(x.order_no)}<br>${x.items.map(i=>`${e(i.product_name)} ${e(i.flavour)} ${e(i.size_label)}${i.vac?' ('+e(i.vl||'Vacuum pack')+')':''} x ${i.qty}`).join('<br>')}</body>`);w.document.close();setTimeout(()=>w.print(),400)}
V.stats=async()=>{const s=await P('stats'),t=(a,h)=>{const mx=Math.max(1,...a.map(r=>r.packs));return`<div class="c"><h3>${h}</h3>${a.map(r=>`<div class="row"><span style="width:150px">${e(r.k)}</span><div class="bar" style="width:${r.packs/mx*40}%"></div><span>${r.packs} packs${r.orders!=null?' · '+r.orders+' orders':''}</span></div>`).join('')||'No data yet'}</div>`};$('#v').innerHTML=`<div class="c"><h3>Monthly revenue (after discounts)</h3><p><small>Tap a month to see every order, every customer and the amount.</small></p><table class="tb"><tr><th>Month</th><th>Orders</th><th>Revenue</th><th>Discount given</th><th></th></tr>${(s.rev||[]).map(r=>`<tr style="cursor:pointer" onclick="MON='${r.k}';T='month';load()"><td><b>${mname(r.k)}</b></td><td>${r.orders}</td><td><b>${R(r.amt||0)}</b></td><td>${r.dis?R(r.dis):'-'}</td><td><button>View full month →</button></td></tr>`).join('')||'<tr><td colspan=5>No data yet</td></tr>'}</table></div>`+t(s.m,'Monthly sales')+t(s.y,'Yearly sales')+t(s.top,'Top 10 flavours')};
const chip=(t,o)=>`<span class="chip ${o.in_stock?'':'x'}" onclick="tg('${t}',${o.id},${o.in_stock?0:1})">${e(o.name||o.label)}${U.role=='admin'?`<u onclick="event.stopPropagation();if(confirm('Remove?'))go('${t=='f'?'delF':'delS'}',{id:${o.id}})">✕</u>`:''}</span>`;
const IMG0='/images/logo-oval.png',pcard=(x,n,L,A,op)=>`<details class="c" data-i="${x.id}" ${op.includes(''+x.id)?'open':''}><summary><b>${e(x.name)}</b> ${x.active?'':'<span class="badge x">Hidden</span>'} ${x.in_stock?'':'<span class="badge x">Out of stock</span>'} · ${x.fl.length} flavours · ${x.sizes.length} sizes</summary>
<div class="row" style="margin:10px 0"><img src="${e(x.image||IMG0)}" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee">${A?`<div><input type="file" id="pp${x.id}" accept="image/*"><br><button class="g" style="margin-top:4px" onclick="setImg('p',${x.id},'pp${x.id}')">Change product photo</button></div>`:''}<button class="g" onclick="tg('p',${x.id},${x.in_stock?0:1})">${x.in_stock?'Mark out of stock':'Mark in stock'}</button>${A?`<button class="g" ${n?'':'disabled'} onclick="go('moveP',{id:${x.id},d:'up'})">↑ Move up</button><button class="g" ${n<L-1?'':'disabled'} onclick="go('moveP',{id:${x.id},d:'down'})">↓ Move down</button><button class="g" onclick="go('activeP',{id:${x.id},v:${x.active?0:1}})">${x.active?'Hide from website':'Show on website'}</button><button class="r" onclick="if(confirm('Delete the whole product?'))go('delP',{id:${x.id}})">Delete product</button>`:''}</div>

const cleaner=t=>`<div class="c"><h3>Clean ${TN[t]}</h3><p><small>Choose filters (nothing ticked = every status), press Count to see how many match, then delete. Nothing is deleted until you type DELETE.</small></p><div class="row"><b>Status:</b>${STS[t].map(s=>`<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" class="cs_${t}" value="${s}">${s}</label>`).join('')}</div><div class="row">${t=='orders'?`<select id="src_${t}"><option value="">Online + manual</option><option value="online">Online only</option><option value="manual">Manual only</option></select>`:''}<select id="age_${t}"><option value="">Any date</option><option value="1">Older than 1 month</option><option value="3">Older than 3 months</option><option value="6">Older than 6 months</option><option value="12">Older than 12 months</option></select><input type="date" id="dt_${t}" title="Or older than this date"></div><div class="row"><button class="g" onclick="cCount('${t}')">Count</button>${t=='orders'?`<button class="g" onclick="cExp('${t}')">⬇ Backup CSV first</button>`:''}<button class="r" onclick="cDel('${t}')">Delete matching</button><span id="res_${t}"></span></div></div>`;

async function cDel(t){const f=cFil(t),r=await P('purgeCount',f);if(!r.n){$('#res_'+t).textContent='Nothing matches';return}const any=f.status.length||f.source||f.before;if(prompt((any?'':'NO FILTER SELECTED: this deletes EVERYTHING in '+TN[t]+'.\n')+'This permanently deletes '+r.n+' '+TN[t]+(t=='orders'?' (worth '+R(r.amt)+')':'')+'.\nType DELETE to confirm')!='DELETE')return;const x=await P('purge',{...f,confirm:'DELETE'});alert(x.deleted+' deleted');load()}
