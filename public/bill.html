<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Bill | Bhavnaben Khakhrawala</title><link rel="icon" type="image/png" href="/images/favicon.png">
<style>
:root{--o:#f26a1b;--r:#d62a1a;--y:#ffc21a;--br:#3b2113;--cr:#fff7e3;--g:#1b7a3a}
*{box-sizing:border-box;margin:0}body{font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#efe6d2;color:#2a1a10;padding:18px 12px 60px}
.bar{max-width:860px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bar a,.bar button{font:600 14px system-ui,sans-serif;border:0;border-radius:99px;padding:10px 20px;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--o),var(--r))}
.bar .wa{background:linear-gradient(135deg,#25d366,#128c7e)}
.inv{max-width:860px;margin:auto;background:#fff;border-radius:6px;box-shadow:0 12px 40px #3b211333;overflow:hidden;position:relative}
.top{height:10px;background:linear-gradient(90deg,var(--r),var(--o),var(--y))}
.hd{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 34px 14px;flex-wrap:wrap;background:linear-gradient(180deg,#fff7e3,#fff)}
.hd .lg{height:118px;width:auto;display:block}
.ti{text-align:right}.ti h1{font:800 32px Georgia,'Times New Roman',serif;letter-spacing:.1em;color:var(--br)}.ti .no{font-weight:700;color:var(--r);font-size:15px;margin-top:2px}.ti small{display:block;color:#6a5646}
.st{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;background:#e6f4ea;color:var(--g);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.st.c{background:#fde2de;color:var(--r)}.st.n{background:#ffe9b0;color:#7a5a00}
.co{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 34px;border:1px solid #f0e2c4;border-radius:12px;overflow:hidden;font-size:12.5px;line-height:1.5;color:#4a372a}
.co>div{padding:9px 14px}.co>div+div{border-left:1px solid #f0e2c4}.co b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--r)}
.cn{margin:8px 34px 0;font-size:12.5px;color:#4a372a;display:flex;gap:6px 18px;flex-wrap:wrap}
.bd{padding:6px 34px 26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0 18px}
.bx{background:var(--cr);border-radius:10px;padding:12px 16px;border-left:4px solid var(--o)}.bx h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--r);margin-bottom:4px}.bx b{font-size:15px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.meta div{border:1px solid #f0e2c4;border-radius:10px;padding:8px 12px}.meta small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a7260}.meta b{font-size:14px}
table.it{width:100%;border-collapse:collapse}table.it th{background:var(--br);color:#fff;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 12px}th.n,td.n{text-align:right;white-space:nowrap}
table.it td{padding:11px 12px;border-bottom:1px solid #f0e6d2;vertical-align:top}table.it tr:nth-child(even) td{background:#fffaf0}table.it td small{color:#7a6656}
.sm{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-top:16px;flex-wrap:wrap}.sm .nt{flex:1;min-width:220px;font-size:12.5px;color:#5a4636}
.sm table{width:320px;max-width:100%}.sm td{padding:6px 12px}
.sm .dc td{color:var(--g);font-weight:600}.sm .gt td{border-top:2px solid var(--br);font-size:19px;font-weight:800;color:var(--br);padding-top:10px}.sm .gt td.n{color:var(--r)}
.cp{display:inline-block;background:#e6f4ea;color:var(--g);border:1px dashed var(--g);border-radius:6px;padding:0 8px;font-size:12px;margin-left:4px;letter-spacing:.05em}
.sv{margin-top:16px;background:#e6f4ea;color:var(--g);border-radius:10px;padding:9px 14px;font-weight:600;text-align:center}
.pay{margin-top:14px;background:var(--cr);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#5a4636}
.ft{text-align:center;border-top:1px dashed #cdbb9a;margin:22px 0 0;padding-top:14px;color:#6a5646;font-size:12.5px}.ft b{color:var(--br);font-size:15px;display:block;margin-bottom:2px}
.wm{position:absolute;right:-60px;bottom:70px;width:360px;opacity:.05;pointer-events:none}
#msg{max-width:860px;margin:60px auto;text-align:center;background:#fff;border-radius:16px;padding:40px}
@media(max-width:640px){.hd,.bd{padding-left:16px;padding-right:16px}.co,.cn{margin-left:16px;margin-right:16px}.co{grid-template-columns:1fr}.co>div+div{border-left:0;border-top:1px solid #f0e2c4}.two{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.ti{text-align:left}.hd .lg{height:92px}table.it th:nth-child(3),table.it td:nth-child(3){display:none}}
@media print{body{background:#fff;padding:0}.bar{display:none}.inv{box-shadow:none;border-radius:0;max-width:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:10mm}}
</style></head><body>
<div id="msg">Loading your bill...</div>
<script>
const $=s=>document.querySelector(s),Q=new URLSearchParams(location.search),R=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:(+n%1?2:0),maximumFractionDigits:2}),
e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
wn=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))return d;if(d.length==11&&d[0]=='0')d=d.slice(1);if(d.length>=10)return '91'+d.slice(-10);return ''},
fd=d=>new Date(String(d).replace(' ','T')+'Z').toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});
(async()=>{try{
 const no=(Q.get('no')||'').replace(/[^A-Za-z0-9]/g,''),t=Q.get('t')||'';if(!no)throw 0;
 const r=await fetch('/api/bill/'+no+'?t='+encodeURIComponent(t));if(!r.ok)throw 0;const o=await r.json(),S=await fetch('/api/settings').then(x=>x.json()).catch(()=>({})),sv=(k,d)=>(S[k]!=null&&S[k]!=='')?S[k]:d,lg=sv('logo','/images/logo.png'),wad=(()=>{let d=String(sv('wa_number','916355934337')).replace(/\D/g,'');if(d.length==10)d='91'+d;return d})(),waf=wad.length==12?'+'+wad.slice(0,2)+' '+wad.slice(2,7)+' '+wad.slice(7):'+'+wad,n=wn(o.phone),link=location.origin+'/bill.html?no='+o.order_no+'&t='+encodeURIComponent(t),packs=o.items.reduce((a,i)=>a+i.qty,0);
 const wt='🧾 *Bhavnaben Khakhrawala*%0A*Bill No:* '+o.order_no+'%0A*Total:* '+R(o.total)+'%0A%0AView / download your bill:%0A'+encodeURIComponent(link);
 document.title='Bill '+o.order_no+' | Bhavnaben Khakhrawala';
 document.body.innerHTML=`<div class="bar">${n?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${wt}">📲 Send on WhatsApp</a>`:''}<button onclick="print()">🖨️ Print / Save PDF</button></div>
<div class="inv"><div class="top"></div><img class="wm" src="${e(lg)}" alt="">
<div class="hd"><img class="lg" src="${e(lg)}" alt="Bhavnaben Khakhrawala"><div class="ti"><h1>BILL</h1><div class="no">#${e(o.order_no)}</div><small>${e(fd(o.date))}</small><span class="st ${o.status=='cancelled'?'c':o.status=='new'?'n':''}">${e(o.status)}</span></div></div>
<div class="co"><div><b>Office</b>${e(sv('addr_office','Plot no. B1, B2, Kailash Row House, opp. Mahavir Heights, New Kosad Road, Amroli, Surat'))}</div><div><b>Shop</b>${e(sv('addr_shop','53, 54 Rang Nagar Society, Jain Temple Main Road, near Laxmi Flour Mill, Amroli, Surat'))}</div></div>
<div class="cn">${[[sv('phone1_name','Vishal Shah'),sv('phone1','+91 99255 20051')],[sv('phone2_name','Paras Shah'),sv('phone2','+91 99988 02435')]].filter(x=>x[1]).map(x=>`<span>📞 ${x[0]?e(x[0])+': ':''}${e(x[1])}</span>`).join('')}<span>💬 WhatsApp: ${waf}</span><span>FSSAI Lic No: ${e(sv('fssai','20718031000014'))}</span></div>
<div class="bd"><div class="two"><div class="bx"><h4>Billed to</h4><b>${e(o.name)}</b><br>📞 ${e(o.phone)}${o.email?'<br>✉️ '+e(o.email):''}</div><div class="bx"><h4>Delivery address</h4>${e(o.address)||'-'}<br>${e([o.city,o.pincode].filter(Boolean).join(' - '))}</div></div>
<div class="meta"><div><small>Bill no.</small><b>${e(o.order_no)}</b></div><div><small>Date</small><b>${e(fd(o.date).split(',').slice(0,2).join(','))}</b></div><div><small>Items / packs</small><b>${o.items.length} items · ${packs} packs</b></div><div><small>Status</small><b style="text-transform:capitalize">${e(o.status)}</b></div></div>
<table class="it"><thead><tr><th>#</th><th>Product</th><th>Pack</th><th class="n">Rate</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>${o.items.map((i,k)=>`<tr><td>${k+1}</td><td><b>${e(i.product_name)}</b><br><small>${e(i.flavour)}</small></td><td>${e(i.size_label)}${i.vac?'<br><small>'+e(i.vl||'Vacuum pack')+'</small>':''}</td><td class="n">${i.price!=null?R(i.price):'-'}</td><td class="n">${i.qty}</td><td class="n"><b>${i.price!=null?R(i.price*i.qty):'-'}</b></td></tr>`).join('')}</tbody></table>
<div class="sm"><div class="nt">${o.notes?`<b>Order note:</b> ${e(o.notes)}`:''}</div><table><tr><td>Subtotal</td><td class="n">${R(o.subtotal)}</td></tr>${o.discount>0?`<tr class="dc"><td>Coupon discount${o.coupon?` <span class="cp">${e(o.coupon)}</span>`:''}</td><td class="n">− ${R(o.discount)}</td></tr>`:''}${(o.charges||[]).map(c=>`<tr><td>${e(c.label)}</td><td class="n">${R(c.amount)}</td></tr>`).join('')}<tr class="gt"><td>Total</td><td class="n">${R(o.total)}</td></tr></table></div>
${o.discount>0?`<div class="sv">🎉 You saved ${R(o.discount)} on this order</div>`:''}
<div class="pay"><b>Payment &amp; delivery:</b> Our team will confirm your order, payment and delivery with you on call / WhatsApp. For any help, message us on WhatsApp ${waf}.</div>
<div class="ft"><b>Thank you for choosing Bhavnaben Khakhrawala 🙏</b>${e(sv('footer_text','Khakhra, Bhakhri, Coin Khakhra and Gujarati Snacks. Since 1998.'))}<br>This is a computer generated bill.</div></div></div>`;
 if(Q.get('print')=='1')setTimeout(print,700);
}catch(x){$('#msg').innerHTML='<h2>Bill not found</h2><p style="margin-top:8px">This bill link is invalid or has expired. Please contact us on +91 63559 34337.</p>'}})();
</script></body></html>
