const IMG0='/images/logo-oval.png',pcard=(x,n,L,A,op)=>`<details class="c" data-i="${x.id}" ${op.includes(''+x.id)?'open':''}><summary><b>${e(x.name)}</b> ${x.active?'':'<span class="badge x">Hidden</span>'} ${x.in_stock?'':'<span class="badge x">Out of stock</span>'} · ${x.fl.length} flavours · ${x.sizes.length} sizes</summary>
<div class="row" style="margin:10px 0"><img src="${e(x.image||IMG0)}" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee">${A?`<div><input type="file" id="pp${x.id}" accept="image/jpeg,image/png,image/webp"><br><button class="g" style="margin-top:4px" onclick="setImg('p',${x.id},'pp${x.id}')">Change product photo</button></div>`:''}<button class="g" onclick="tg('p',${x.id},${x.in_stock?0:1})">${x.in_stock?'Mark out of stock':'Mark in stock'}</button>${A?`<button class="g" ${n?'':'disabled'} onclick="go('moveP',{id:${x.id},d:'up'})">↑ Move up</button><button class="g" ${n<L-1?'':'disabled'} onclick="go('moveP',{id:${x.id},d:'down'})">↓ Move down</button><button class="g" onclick="go('activeP',{id:${x.id},v:${x.active?0:1}})">${x.active?'Hide from website':'Show on website'}</button><button class="r" onclick="if(confirm('Delete the whole product?'))go('delP',{id:${x.id}})">Delete product</button>`:''}</div>
${A?`<div class="row fl"><div><label>Product name</label><input id="en${x.id}" value="${e(x.name)}"></div><div style="flex:2"><label>Description</label><input id="ed${x.id}" value="${e(x.description||'')}"></div><div><label>Shelf life</label><input id="eh${x.id}" value="${e(x.shelf_life||'')}"></div><div><label>Special pack name (Vacuum pack, Container ...)</label><input id="ev${x.id}" value="${e(x.vac_label)}"></div></div><div class="row" style="margin-top:6px"><button onclick="saveP(${x.id})">Save product details</button></div><p><small>"Special pack name" is the word customers see for this product's second price option. Set its price in the Prices tab.</small></p>`:''}
<h4>Sizes / packs</h4>${x.sizes.map(z=>`<div class="row" style="margin:3px 0"><input id="zs${z.id}" value="${e(z.label)}" style="width:120px" ${A?'':'disabled'}>${A?`<button class="g" onclick="saveS(${z.id})">Rename</button>`:''}<button class="g" onclick="tg('z',${z.id},${z.in_stock?0:1})">${z.in_stock?'In stock':'Out of stock'}</button>${A?`<button class="r" onclick="if(confirm('Remove this size?'))go('delS',{id:${z.id}})">✕</button>`:''}</div>`).join('')||'<p>No sizes yet.</p>'}${A?`<div class="row"><input id="sz${x.id}" placeholder="New size e.g. 1kg" style="width:150px"><button onclick="go('addS',{pid:${x.id},label:$('#sz${x.id}').value})">Add size</button></div><p><small>After adding a size, fill its price in the Prices tab.</small></p>`:''}
<h4>Flavours (name, price group, photo, order)</h4><div style="overflow:auto"><table class="tb">${x.fl.map((f,i)=>`<tr><td><img src="${e(f.image||x.image||IMG0)}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eee"></td><td>${A?`<input id="fnm${f.id}" value="${e(f.name)}" style="min-width:140px"><br><input id="fgp${f.id}" value="${e(f.grp||'Flavour')}" style="min-width:140px;margin-top:3px" title="Price group">`:`<b>${e(f.name)}</b><br><small>${e(f.grp||'')}</small>`}</td><td style="white-space:nowrap">${A?`<button onclick="saveF(${f.id})">Save</button> `:''}<button class="g" onclick="tg('f',${f.id},${f.in_stock?0:1})">${f.in_stock?'In stock':'Out of stock'}</button>${A?` <label class="g" style="cursor:pointer;display:inline-block;padding:7px 14px;border-radius:99px;border:2px solid #3b2113;font-size:13px">Change photo<input type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="fPhoto(${f.id},this)"></label> <button class="g" ${i?'':'disabled'} onclick="go('moveF',{id:${f.id},d:'up'})">↑</button><button class="g" ${i<x.fl.length-1?'':'disabled'} onclick="go('moveF',{id:${f.id},d:'down'})">↓</button> <button class="r" onclick="if(confirm('Remove this flavour?'))go('delF',{id:${f.id}})">✕</button>`:''}</td></tr>`).join('')}</table></div>${A?`<div class="row fl" style="margin-top:8px"><div><label>New flavour</label><input id="fn${x.id}"></div><div><label>Group (price group)</label><input id="fg${x.id}" placeholder="Regular / Flavour / Special"></div><div><label>Photo</label><input type="file" id="ff${x.id}" accept="image/jpeg,image/png,image/webp"></div><div style="flex:0"><label>&nbsp;</label><button onclick="addF(${x.id})">Add flavour</button></div></div><p><small>Flavours with the same Group share the same prices. Changing a flavour's group copies that group's prices, then you can adjust them in the Prices tab.</small></p>`:''}</details>`;
V.products=async()=>{const op=[...document.querySelectorAll('details[open]')].map(d=>d.dataset.i),p=await P('prods'),A=U.role=='admin';$('#v').innerHTML=(A?`<div class="c"><h3>Add new product</h3><div class="row fl"><div><label>Name *</label><input id="pn"></div><div style="flex:2"><label>Description</label><input id="pd"></div><div><label>Sizes (comma separated)</label><input id="ps" placeholder="200g,500g"></div><div><label>Shelf life</label><input id="ph" placeholder="45 days"></div><div><label>Special pack name</label><input id="pv" placeholder="Vacuum pack"></div><div><label>Photo</label><input type="file" id="pi" accept="image/jpeg,image/png,image/webp"></div></div><div class="row" style="margin-top:8px"><button onclick="addP()">Add product</button></div></div>`:'')+p.map((x,n)=>pcard(x,n,p.length,A,op)).join('')};

async function addF(i){if(!$('#fn'+i).value)return alert('Enter flavour name');go('addF',{pid:i,name:$('#fn'+i).value,grp:$('#fg'+i).value,image:await rs($('#ff'+i).files[0])})}
async function setImg(t,id,inp){const f=$('#'+inp).files[0];if(!f)return alert('Choose a photo first');await go('setImg',{t,id,image:await rs(f)})}

async function saveP(i){if(!$('#en'+i).value.trim())return alert('Enter product name');await P('editP',{id:i,name:$('#en'+i).value,desc:$('#ed'+i).value,shelf:$('#eh'+i).value,vac_label:$('#ev'+i).value});alert('Saved');load()}
async function saveS(i){if(!$('#zs'+i).value.trim())return alert('Enter size');await P('editS',{id:i,label:$('#zs'+i).value});alert('Saved (prices carried over)');load()}
async function saveF(i){if(!$('#fnm'+i).value.trim())return alert('Enter flavour name');await P('editF',{id:i,name:$('#fnm'+i).value,grp:$('#fgp'+i).value});alert('Saved');load()}
V.prices=async()=>{const p=await P('prices');$('#v').innerHTML='<div class="c"><h3>Prices (₹)</h3><p><small>Fill Price and the special pack price (Vacuum / Container / any name you set for that product in the Products tab) for each size. Leave the special pack price empty if that pack does not exist (customer will not see it). Leave Price empty to show "Price not set yet" and block ordering.</small></p></div>'+p.map(x=>{const g=x.groups.length?x.groups:['Classic'];return`<div class="c" data-pid="${x.id}"><h3>${e(x.name)}</h3><div style="overflow:auto"><table style="border-collapse:collapse;width:100%"><tr><th align="left">Group</th>${x.sizes.map(z=>`<th>${e(z)}<br><small>Price / ${e(x.vl)}</small></th>`).join('')}</tr>${g.map(gr=>`<tr style="border-top:1px solid #eee"><td><b>${e(gr)}</b></td>${x.sizes.map(z=>{const r=x.pr.find(y=>y.grp==gr&&y.size_label==z)||{};return`<td align="center"><input class="pi" data-g="${e(gr)}" data-z="${e(z)}" data-k="p" type="number" min="0" step="0.5" value="${r.price==null?'':r.price}" placeholder="₹" style="width:80px"> <input class="pi" data-g="${e(gr)}" data-z="${e(z)}" data-k="v" type="number" min="0" step="0.5" value="${r.vac_price==null?'':r.vac_price}" placeholder="${e(x.vl)} ₹" style="width:80px"></td>`}).join('')}</tr>`).join('')}</table></div><br><button onclick="savePr(this)">Save ${e(x.name)} prices</button></div>`}).join('')};
async function savePr(b){const c=b.closest('.c'),m={};c.querySelectorAll('.pi').forEach(i=>{const k=i.dataset.g+'|'+i.dataset.z;m[k]=m[k]||{pid:c.dataset.pid,grp:i.dataset.g,label:i.dataset.z};m[k][i.dataset.k=='p'?'price':'vac']=i.value});await P('savePrices',{rows:Object.values(m)});alert('Prices saved')}
V.reviews=async()=>{const r=await P('revs',RF),A=U.role=='admin';$('#v').innerHTML=`<div class="row"><input id="rq" placeholder="Search name / city / review text" value="${e(RF.q)}" oninput="fSearch('rq','rs',RF)" style="flex:1;min-width:200px"><select id="rs" onchange="fSearch('rq','rs',RF)">${[['','All'],['pending','Pending'],['approved','Approved'],['rejected','Rejected']].map(o=>`<option value="${o[0]}" ${RF.s==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${A?`<button class="r" onclick="clr('reviews')">Delete ALL reviews</button>`:''}</div>${A?selBar('reviews'):''}<p><small>${r.length} shown${r.length>=300?' (latest 300, use search to narrow)':''}</small></p>`+(r.map(x=>`<div class="c"><div class="row">${A?`<input type="checkbox" class="sel" value="${x.id}">`:''}<b>${e(x.name)}</b> ${e(x.city)} · ${'★'.repeat(x.rating)} <span class="${x.status=='pending'?'new':''}">${x.status}</span></div><p>${e(x.body)}</p>${x.image?`<img src="${e(x.image)}" style="max-height:120px">`:''}<div class="row"><button onclick="go('rev',{id:${x.id},v:'approved'})">Approve</button><button class="g" onclick="go('rev',{id:${x.id},v:'rejected'})">Reject</button>${A?`<button class="r" onclick="if(confirm('Delete this review?'))go('rev',{id:${x.id},v:'delete'})">Delete</button>`:''}</div></div>`).join('')||'<p>No reviews found.</p>')};
V.wholesale=async()=>{const r=await P('ws',WF),A=U.role=='admin';$('#v').innerHTML=`<div class="row"><input id="wq" placeholder="Search business / name / phone / city / message" value="${e(WF.q)}" oninput="fSearch('wq','wsx',WF)" style="flex:1;min-width:200px"><select id="wsx" onchange="fSearch('wq','wsx',WF)">${[['','All'],['new','New'],['contacted','Contacted'],['closed','Closed']].map(o=>`<option value="${o[0]}" ${WF.s==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${A?`<button class="r" onclick="clr('wholesale')">Delete ALL inquiries</button>`:''}</div>${A?selBar('wholesale'):''}<p><small>${r.length} shown</small></p>`+(r.map(x=>`<div class="c"><div class="row">${A?`<input type="checkbox" class="sel" value="${x.id}">`:''}<b>${e(x.business_name)}</b> · ${e(x.contact_name)} · ${e(x.phone)} · ${e(x.city)}<select onchange="go('wst',{id:${x.id},v:this.value})">${['new','contacted','closed'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>${A?`<button class="r" onclick="if(confirm('Delete this inquiry?'))go('delWs',{id:${x.id}})">Delete</button>`:''}</div><p>${e(x.business_type)} · ${e(x.products_interested)} · ${e(x.monthly_qty)}<br>${e(x.message)}</p></div>`).join('')||'<p>None found.</p>')};
V.coupons=async()=>{const c=await P('coupons'),f=x=>(x.type=='flat'?R(x.value)+' flat':x.value+'%'+(x.max_discount?' (max '+R(x.max_discount)+')':''));window.CP=c;
$('#v').innerHTML=`<div class="c" id="cf"></div><div class="c"><h3>All coupons</h3><div style="overflow:auto"><table class="tb"><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Used</th><th>Per customer</th><th>Expiry</th><th>Status</th><th></th></tr>${c.map((x,n)=>`<tr><td><span class="cpn">${e(x.code)}</span><br><small>${e(x.note||'')}</small></td><td><b>${f(x)}</b></td><td>${x.min_order?R(x.min_order):'-'}</td><td>${x.used}${x.max_uses?' / '+x.max_uses:' / ∞'}</td><td>${x.per_customer==0?'Unlimited':x.per_customer+' time'+(x.per_customer>1?'s':'')}</td><td>${x.expires||'-'}</td><td class="${x.active?'ok':'off'}">${x.active?'Active':'Inactive'}</td><td style="white-space:nowrap"><button class="${x.active?'g':''}" onclick="go('togC',{id:${x.id},v:${x.active?0:1}})">${x.active?'Make inactive':'Activate'}</button> <button class="g" onclick="cEdit(${n})">Edit</button> <button class="r" onclick="if(confirm('Delete this coupon?'))go('delC',{id:${x.id}})">Delete</button></td></tr>`).join('')||'<tr><td colspan=8>No coupons yet. Create the first one above.</td></tr>'}</table></div></div>`;cEdit(-1)};
function cEdit(n){const x=n>=0?CP[n]:{type:'percent',per_customer:1};$('#cf').innerHTML=`<h3>${n>=0?'Edit coupon '+e(x.code):'Create new coupon'}</h3><div class="row fl"><div><label>Coupon code *</label><input id="cc" value="${e(x.code||'')}" placeholder="e.g. DIWALI10" style="text-transform:uppercase"></div><div><label>Discount type *</label><select id="ct"><option value="percent" ${x.type!='flat'?'selected':''}>Percentage (%)</option><option value="flat" ${x.type=='flat'?'selected':''}>Flat amount (₹)</option></select></div><div><label>Discount value *</label><input id="cv" type="number" min="0" step="0.5" value="${x.value==null?'':x.value}" placeholder="10 or 50"></div><div><label>Minimum order (₹)</label><input id="cm" type="number" min="0" value="${x.min_order||''}" placeholder="0 = none"></div></div><div class="row fl" style="margin-top:6px"><div><label>Total uses allowed (all customers)</label><input id="cu" type="number" min="0" value="${x.max_uses||''}" placeholder="empty = unlimited"></div><div><label>Uses per customer (phone no.)</label><input id="cp" type="number" min="0" value="${x.per_customer==null?1:x.per_customer}" placeholder="1 = once, 0 = unlimited"></div><div><label>Max discount cap (₹, % only)</label><input id="cx" type="number" min="0" value="${x.max_discount||''}" placeholder="optional"></div><div><label>Expiry date (optional)</label><input id="ce" type="date" value="${x.expires||''}"></div><div><label>Note (for you)</label><input id="cn" value="${e(x.note||'')}" placeholder="optional"></div></div><div class="row" style="margin-top:10px"><button onclick="cSave(${n>=0?x.id:0})">${n>=0?'Save changes':'Create coupon'}</button>${n>=0?'<button class="g" onclick="cEdit(-1)">Cancel</button>':''}</div><p><small>Once per customer: set "Uses per customer" to 1. Custom limit: any number. Switch any coupon Inactive from the list below whenever you want.</small></p>`}
async function cSave(id){if(!$('#cc').value.trim()||!$('#cv').value)return alert('Enter coupon code and discount value');if($('#ct').value=='percent'&&+$('#cv').value>100)return alert('Percentage cannot be above 100');try{await P('saveCoupon',{id,code:$('#cc').value,type:$('#ct').value,value:$('#cv').value,min_order:$('#cm').value,max_uses:$('#cu').value,per_customer:$('#cp').value,max_discount:$('#cx').value,expires:$('#ce').value,note:$('#cn').value});load()}catch(x){}}
V.month=async()=>{const d=await P('month',{m:MON}),s=d.sum,mx=Math.max(1,...d.days.map(x=>x.amount));window.MD=d;

<div class="kp"><div class="hl"><b>${R(s.revenue)}</b><span>Revenue</span></div><div><b>${s.orders}</b><span>Orders${s.cancelled?' · '+s.cancelled+' cancelled':''}</span></div><div><b>${R(s.avg)}</b><span>Average order</span></div><div><b>${s.packs}</b><span>Packs sold</span></div><div><b>${s.customers}</b><span>Customers · ${s.returning} returning</span></div><div><b>${R(s.discount)}</b><span>Coupon discount given</span></div></div>
<div class="c"><h3>Day by day</h3>${d.days.length?`<div class="dbar">${d.days.map(x=>`<div style="height:${Math.max(2,x.amount/mx*100)}%" title="${x.d}: ${x.orders} orders, ${R(x.amount)}"></div>`).join('')}</div><div class="dl">${d.days.map(x=>`<span>${x.d}</span>`).join('')}</div>`:'<p>No orders this month.</p>'}</div>
<div class="c"><h3>Customers (${d.customers.length})</h3><div style="overflow:auto"><table class="tb"><tr><th>#</th><th>Customer</th><th>Phone</th><th>Times ordered</th><th>Amount</th><th>Last order</th><th></th></tr>${d.customers.map((c,n)=>`<tr><td>${n+1}</td><td><b>${e(c.name)}</b> <span class="badge ${c.returning?'':'n'}">${c.returning?'Returning':'New'}</span></td><td>${e(c.phone)}</td><td><b>${c.orders}</b></td><td><b>${R(c.amount)}</b></td><td><small>${fdt(c.last)}</small></td><td>${wn(c.phone)?`<a target="_blank" href="https://wa.me/${wn(c.phone)}"><button style="background:#25d366">WhatsApp</button></a>`:''}</td></tr>`).join('')||'<tr><td colspan=7>None</td></tr>'}</table></div></div>
<div class="c"><h3>What sold this month</h3><div style="overflow:auto"><table class="tb"><tr><th>Product</th><th>Flavour</th><th>Packs</th><th>Amount</th></tr>${d.products.map(x=>`<tr><td>${e(x.product_name)}</td><td>${e(x.flavour)}</td><td><b>${x.packs}</b></td><td>${R(x.amt)}</td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div></div>
